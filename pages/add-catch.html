    <main class="container">
        <h1>Add Catch</h1>

        <form>
            <p>
                <label>Fish:</label>
                <input type="text">
            </p>

            <p>
                <label>Location:</label>
                <input type="text">
            </p>

            <p>
                <label>Weight:</label>
                <input type="number">
            </p>

            <p>
                <label>Date:</label>
                <input type="date">
            </p>

            <button type="button" id="addCatchButton">Add Catch</button>

            <div class="alert alert-success" id="successMessage">
                Catch added successfully!
            </div>
        </form>
    </main>
