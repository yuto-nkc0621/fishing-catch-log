<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fishing Catch Log</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">

</head>

<body>
  <nav>
    <a href="index.html">Fishing Catch Log</a>
    <a href="index.html">Home</a>
    <a href="pages/add-catch.html"><i class="bi bi-plus-circle"></i> Add Catch</a>
    <a href="pages/signin.html">Sign In</a>
    <span>Yuto | Sign Out</span>
  </nav>

  <main class="container">
    <p></p>
    <h1>Fishing Catch Log</h1>
    <p class="web-intro">Track your catches and remember your best fishing spots.</p>

    <section class="search">
        <h2>Search Catches</h2>
        <label>Fish Name:</label>
        <input type="text">
        <button type="button" id="searchButton">Search</button>
        <p id="searchMessage">Searching for catches...</p>
    </section>
    <p></p><p></p><p></p><p></p><p></p><p></p><p></p>

  
    <h2>Recent Catches</h2>
    <section>
      <article class="card">
        <figure>
          <img src="img/catfish.jpg" alt="Cat Fish" class="fish-image">
          <div class="card-body">
           <h3 class="card-title">Cat Fish</h3>

           <p>Location: Florence</p>
           <p>Weight: 6.0 lb</p>
           <p>Date: September 20, 2026</p>
         </div>
          <figcaption>It was so tasty.</figcaption>
        </figure>
      </article>
    </section>


  </main>
  <footer>
    <p>Fishing Catch Log</p>
    <p>Created by Yuto Nakashima</p>
  </footer>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/app.js"></script>

<script src="js/app.js"></script> 
</body>
</html>
